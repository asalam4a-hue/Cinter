<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة ومتابعة العقود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#070b1a;--panel:rgba(18,26,58,.72);--panel2:rgba(255,255,255,.04);--line:rgba(130,155,255,.18);--tx:#e8ecff;--mut:#8f9bc4;--pri:#4f8cff;--ok:#2de2a6;--warn:#ffb020;--bad:#ff4d6d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--tx);overflow:hidden;
 background:radial-gradient(1100px 600px at 85% -10%,rgba(40,70,180,.38),transparent),radial-gradient(900px 500px at -5% 110%,rgba(120,40,170,.30),transparent),var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx)}
input,select,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;transition:.2s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,140,255,.2)}
select option{background:#101838;color:#fff}
input[type=date]{color-scheme:dark}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(130,155,255,.3);border-radius:9px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:10px;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#3b6cff,#7a4dff);border-color:transparent;box-shadow:0 4px 18px -4px #4f6cff}
.btn.bad{background:rgba(255,77,109,.15);border-color:rgba(255,77,109,.5)}
.btn.sm{padding:4px 9px;font-size:12px}
.ib{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
.ib:hover{background:rgba(255,255,255,.08)}
/* login */
.login{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.lbox{width:min(400px,100%);padding:30px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 0 60px -10px #4f6cff;text-align:center;animation:rise .7s backwards}
.lbox .logo{width:92px;height:92px;margin:0 auto 10px;animation:float 4s ease-in-out infinite}
.lbox h1{font-size:20px;margin:6px 0 18px}
.lbox input{width:100%;margin-bottom:10px}
.lbox .btn{width:100%;padding:10px}
.logo{display:grid;place-items:center;font-size:42px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#2a3fa8,#6a2fb8);box-shadow:0 0 28px -4px #6a7dff}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.err{color:var(--bad);min-height:20px;font-size:13px;margin-top:8px}
/* layout */
#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:62px 1fr;grid-template-areas:"top top" "nav main";height:100vh}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(8,12,30,.7);backdrop-filter:blur(10px)}
.top .logo{width:42px;height:42px;font-size:22px;border-radius:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.sp{flex:1}
.clock{font-size:13px;color:var(--mut);text-align:left;direction:ltr}
.uchip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:30px;font-size:13px}
.uchip img,.uchip .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#2a3b8a;display:grid;place-items:center}
nav{grid-area:nav;padding:14px 10px;border-left:1px solid var(--line);overflow:auto;background:rgba(8,12,30,.45)}
nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:6px;border-radius:12px;color:var(--mut);cursor:pointer;transition:.25s;border:1px solid transparent;font-weight:600}
nav a:hover{color:var(--tx);background:rgba(255,255,255,.05)}
nav a.on{color:#fff;background:linear-gradient(135deg,rgba(59,108,255,.35),rgba(122,77,255,.3));border-color:rgba(122,140,255,.5);box-shadow:0 0 22px -6px #6a7dff}
main{grid-area:main;overflow:auto;padding:18px 20px 40px}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.vh h2{margin:0;font-size:21px;margin-inline-end:auto}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools{display:flex;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(8px);margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 .tools{margin-inline-start:auto}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g7{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media(min-width:1180px){.g7{grid-template-columns:repeat(7,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.cbox{position:relative;height:300px}
/* KPI */
.kpi{--c:#4f8cff;position:relative;padding:14px 16px;border-radius:16px;overflow:hidden;cursor:pointer;
 background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
 border:1px solid color-mix(in srgb,var(--c) 50%,transparent);
 box-shadow:0 0 18px -4px var(--c);
 animation:rise .6s cubic-bezier(.2,.9,.3,1.15) backwards,glow 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*60ms),calc(var(--i)*200ms);
 transition:transform .25s,filter .25s}
.kpi:hover{transform:translateY(-4px) scale(1.02);filter:brightness(1.2)}
.kpi.on{outline:2px solid var(--c);outline-offset:2px}
.kpi::before{content:'';position:absolute;top:-60%;left:-40%;width:45%;height:220%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:rotate(14deg);animation:sweep 6s ease-in-out infinite;animation-delay:calc(var(--i)*350ms)}
.kpi .ic{position:absolute;inset-inline-end:12px;top:10px;font-size:26px;animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--i)*250ms);filter:drop-shadow(0 0 8px var(--c))}
.kpi .l{font-size:13px;color:var(--mut);margin-bottom:6px;padding-inline-end:34px}
.kpi .v{font-size:28px;font-weight:800;color:#fff;text-shadow:0 0 16px var(--c);line-height:1.1}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.kpi .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);border-radius:4px;transition:width 1s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes glow{0%,100%{box-shadow:0 0 12px -4px var(--c)}50%{box-shadow:0 0 28px -2px var(--c)}}
@keyframes sweep{0%,55%{left:-50%}100%{left:130%}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* pipeline */
.pipe{display:flex;gap:6px;overflow:auto;padding:4px}
.seg{--c:#888;flex:1 1 0;min-width:96px;padding:12px 8px;text-align:center;border-radius:12px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);transition:.25s;position:relative;animation:rise .5s backwards}
.seg b{display:block;font-size:22px;text-shadow:0 0 12px var(--c)}
.seg span{font-size:12px;color:var(--mut)}
.seg:hover{transform:translateY(-3px);box-shadow:0 0 22px -4px var(--c)}
.seg.on{background:color-mix(in srgb,var(--c) 35%,transparent);box-shadow:0 0 26px -2px var(--c)}
.seg::after{content:'◂';position:absolute;inset-inline-end:-10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px;z-index:2}
.seg:last-child::after{display:none}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:20px;background:rgba(79,140,255,.2);border:1px solid var(--pri);font-size:12px;cursor:pointer}
/* tables */
.tw{overflow:auto;max-height:68vh;border-radius:12px;border:1px solid var(--line)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th,.dt td{padding:8px 10px;text-align:right;border-bottom:1px solid rgba(130,155,255,.1);white-space:nowrap}
.dt thead th{position:sticky;top:0;background:#111a3f;z-index:2;cursor:pointer;user-select:none}
.dt thead tr.fr th{top:37px;background:#0d1535;padding:4px 6px;cursor:default;z-index:2}
.dt .fr input{width:100%;min-width:70px;padding:4px 7px;font-size:12px;border-radius:7px}
.dt tbody tr:hover{background:rgba(120,150,255,.09)}
.dt tfoot td{position:sticky;bottom:0;background:#111a3f;font-weight:700;border-top:1px solid var(--line)}
.dt td.n{font-variant-numeric:tabular-nums}
.dt td.late{color:var(--bad);font-weight:700}
.dt .ac{width:1%}
.dt td.ac{white-space:nowrap}
.tmore{text-align:center;margin-top:8px}
.bd{--c:#888;display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:#fff;box-shadow:0 0 10px -3px var(--c)}
.pg{min-width:90px;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;display:inline-block;vertical-align:middle;width:90px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#2de2a6);border-radius:8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,6,18,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:14px;animation:fade .2s}
.md{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:#0e1636;border:1px solid var(--line);border-radius:18px;box-shadow:0 0 50px -8px #4f6cff;animation:rise .35s}
.md.wide{width:min(1000px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.mh .x{background:none;border:0;cursor:pointer;font-size:18px}
.mb{padding:16px 18px;overflow:auto}
@keyframes fade{from{opacity:0}}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fg label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.fg label.full{grid-column:1/-1}
.fg input,.fg select,.fg textarea{width:100%;color:var(--tx)}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.perm{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.perm h4{margin:0 0 8px;display:flex;align-items:center;gap:10px;font-size:14px}
.perm .pl{display:flex;flex-wrap:wrap;gap:6px 16px}
.perm label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx);cursor:pointer}
.perm input{width:auto}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#1d2a66;display:grid;place-items:center;font-size:30px;border:2px solid var(--line)}
.upl{display:flex;align-items:center;gap:12px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:8px 26px 8px 0;margin-bottom:4px}
.tl li::before{content:'';position:absolute;right:6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--c,#4f8cff);box-shadow:0 0 10px var(--c,#4f8cff)}
.tl li::after{content:'';position:absolute;right:10px;top:26px;bottom:-12px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.mut{color:var(--mut);font-size:13px}
#toasts{position:fixed;bottom:18px;left:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:12px;background:#12204f;border:1px solid var(--ok);box-shadow:0 0 20px -4px var(--ok);animation:rise .3s;transition:.4s}
.toast.err{border-color:var(--bad);box-shadow:0 0 20px -4px var(--bad)}
.toast.out{opacity:0;transform:translateX(-20px)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#3b6cff,#7a4dff);border-color:transparent;box-shadow:0 0 18px -4px #6a7dff}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fb label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-areas:"top" "main"}nav{position:fixed;top:62px;bottom:0;right:0;width:230px;z-index:40;background:#0a1030;transform:translateX(100%);transition:.3s}nav.open{transform:none}.clock{display:none}.g2{grid-template-columns:1fr}}
@media(min-width:901px){#menu{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== ثيم أبيض بنصوص سوداء ===== */
:root{--bg:#fff;--panel:#fff;--panel2:#f3f5fb;--line:#cfd6ea;--tx:#000;--mut:#222}
body{background:#fff;color:#000}
input,select,textarea{background:#fff;color:#000;border-color:#b9c3e0}
select option{background:#fff;color:#000}
input[type=date]{color-scheme:light}
.btn{background:#f3f5fb;color:#000}.btn:hover{background:#e3e9fa}
.btn.pri{background:linear-gradient(135deg,#cfe0ff,#e3d6ff);color:#000;border-color:#9db4ee;box-shadow:0 2px 10px -4px #6a7dff}
.btn.bad{background:#ffe3e8;border-color:#ff9bab;color:#000}
.ib{color:#000}.ib:hover{background:#eef2fc}
.lbox{background:#fff;box-shadow:0 10px 50px -12px rgba(60,90,200,.5)}
.logo{background:linear-gradient(135deg,#e3ebff,#efe3ff);box-shadow:0 0 18px -6px #6a7dff}
.top{background:#fff}nav{background:#f6f8fe}
nav a{color:#000}nav a:hover{background:#eaf0ff}
nav a.on{color:#000;background:linear-gradient(135deg,#dbe6ff,#ebdfff);border-color:#9db4ee;box-shadow:0 0 14px -6px #6a7dff}
.panel{background:#fff;backdrop-filter:none;box-shadow:0 2px 10px -6px rgba(40,60,140,.4)}
.kpi{background:linear-gradient(160deg,#fff,#f4f7ff)}
.kpi .v{color:#000;text-shadow:none}.kpi .l,.kpi .s{color:#222}
.kpi .bar{background:rgba(0,0,0,.1)}.kpi:hover{filter:none}
.kpi::before{background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent)}
.seg b{text-shadow:none;color:#000}.seg span{color:#000}
.dt thead th{background:#e9eefc;color:#000}.dt thead tr.fr th{background:#f4f6fd}
.dt tfoot td{background:#e9eefc}.dt tbody tr:hover{background:#eef3ff}
.dt th,.dt td{border-bottom:1px solid #e1e6f5}
.bd{color:#000}.pg{background:rgba(0,0,0,.1)}
.ov{background:rgba(0,0,0,.4)}.md{background:#fff}
.toast{background:#fff;color:#000}
.tabs button{color:#000;background:#f3f5fb}
.tabs button.on{background:linear-gradient(135deg,#cfe0ff,#e3d6ff);color:#000;box-shadow:0 0 12px -4px #6a7dff;border-color:#9db4ee}
.uchip .av,.avatar{background:#e6ecff}
.chip{color:#000;background:#e3ecff}.perm label{color:#000}
::-webkit-scrollbar-thumb{background:rgba(60,90,200,.35)}
.lnk{color:#000;font-weight:700;text-decoration:underline;text-decoration-color:#4f8cff;cursor:pointer;padding:0 2px;border-radius:4px}.lnk:hover{background:#e3ecff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.dgrid div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}
.dgrid small{display:block;color:#222;font-size:12px;font-weight:400}
.mb h4{margin:14px 0 6px}
.dlink{cursor:pointer;border-bottom:1px dotted #4f8cff}.dlink:hover{background:#e3ecff}
.stsel{padding:3px 6px;border-radius:8px;font-weight:700;border:2px solid #aaa;background:#fff;color:#000;cursor:pointer}
</style>
</head>
<body>
<div id="login" class="login" hidden>
 <div class="lbox">
  <div class="logo lg-logo"></div>
  <h1 class="lg-name"></h1>
  <input id="lu" placeholder="اسم المستخدم" autocomplete="username">
  <input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="btn pri" id="lgo">دخول</button>
  <div class="err" id="lerr"></div>
 </div>
</div>
<div id="app" hidden>
 <header class="top">
  <button class="ib" id="menu">☰</button>
  <div class="brand"><span class="logo" id="hlogo"></span><span id="hname"></span></div>
  <div class="sp"></div>
  <div class="clock" id="clock"></div>
  <div class="uchip" id="uchip"></div>
  <button class="ib" id="pwb" title="تغيير كلمة المرور">🔑</button>
  <button class="ib" id="outb" title="تسجيل الخروج">⏻</button>
 </header>
 <nav id="nav"></nav>
 <main id="view"></main>
</div>
<div id="toasts"></div>

<script>
'use strict';
const API_URL='__API_URL__';
const STAGES=['--','جارى التصنيع','تم التصنيع','الجودة','تسليم مخازن','تسليم التجاريه','استلام العقد من العميل'];
const SC=['#8892b0','#ffb020','#19c3ff','#b36bff','#2de2a6','#ff5fa2','#4ade80'];
const FINAL=STAGES[6];
const DATE_FIELDS=[['created_at','تاريخ الإضافة'],['receive_date','تاريخ استلام العقد'],['delivery_date','تاريخ تسليم العقد'],['stage_date','تاريخ المرحلة']];
const PERM_TREE=[
 {k:'dashboard',t:'الشاشة الرئيسية',items:[['view','فتح الشاشة'],['kpi','كروت KPI'],['charts','الرسوم البيانية'],['print','طباعة'],['export','تصدير Excel / PDF'],['whatsapp','إرسال واتس']]},
 {k:'contracts',t:'شاشة العقود',items:[['view','فتح الشاشة'],['add','إضافة عقد'],['edit','تعديل عقد'],['stage','تغيير المرحلة'],['delete','حذف عقد'],['print','طباعة'],['export','تصدير Excel / PDF'],['whatsapp','إرسال واتس']]},
 {k:'follow',t:'شاشة متابعة العقود',items:[['view','فتح الشاشة'],['print','طباعة'],['export','تصدير Excel / PDF'],['whatsapp','إرسال واتس']]},
 {k:'reports',t:'شاشة التقارير',items:[['view','فتح الشاشة'],['rep_contracts','تقارير العقود'],['rep_units','تقرير الوحدات'],['rep_projects','تقرير المشروعات'],['rep_today','تقرير اليوم'],['rep_date','تقرير تاريخ محدد'],['rep_stages','تقرير مراحل الإنتاج'],['print','طباعة'],['export','تصدير Excel / PDF'],['whatsapp','إرسال واتس']]},
 {k:'users',t:'شاشة المستخدمين',items:[['view','فتح الشاشة'],['add','إضافة مستخدم'],['edit','تعديل مستخدم'],['delete','حذف مستخدم']]},
 {k:'settings',t:'شاشة إدارة البرنامج',items:[['view','فتح الشاشة'],['edit','تعديل الإعدادات'],['demo','تحميل بيانات تجريبية']]}
];
const NAV=[['dashboard','الشاشة الرئيسية','📊'],['contracts','العقود','📄'],['follow','متابعة العقود','🛰️'],['reports','التقارير','📑'],['users','المستخدمون','👥'],['settings','إدارة البرنامج','⚙️']];

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const fnum=v=>num(v).toLocaleString('en-US',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());

let DTC=0;
class DT{
 constructor(o){this.o=o;this.uid=++DTC;this.col={};this.q='';this.sort=null;this.lim=150}
 cells(r){return this.o.cols.map(c=>String(c.get?c.get(r):(r[c.k]==null?'':r[c.k])))}
 get rows(){let rs=this.o.rows();const q=this.q.trim().toLowerCase();if(q)rs=rs.filter(r=>this.cells(r).some(v=>v.toLowerCase().includes(q)));for(const [i,v] of Object.entries(this.col)){const t=v.trim().toLowerCase();if(t)rs=rs.filter(r=>this.cells(r)[i].toLowerCase().includes(t))}
  if(this.sort){const {i,d}=this.sort,c=this.o.cols[i];rs=[...rs].sort((a,b)=>{const x=c.num?num(a[c.k]):this.cells(a)[i],y=c.num?num(b[c.k]):this.cells(b)[i];return(c.num?x-y:String(x).localeCompare(String(y),'ar'))*d})}return rs}
 data(){const rs=this.rows;return{head:this.o.cols.map(c=>c.t),rows:rs.map(r=>this.o.cols.map(c=>c.num?num(r[c.k]):String(c.get?c.get(r):(r[c.k]==null?'':r[c.k]))))}}
 mount(host){this.host=host;const cs=this.o.cols,ac=!!this.o.actions;host.innerHTML=`<div class="tw"><table class="dt"><thead><tr>${cs.map((c,i)=>`<th data-s="${i}">${E(c.t)} <i class="si"></i></th>`).join('')}${ac?'<th class="ac"></th>':''}</tr><tr class="fr">${cs.map((c,i)=>`<th><input data-f="${i}" placeholder="بحث..." ${c.date?`list="dl${this.uid}_${i}"`:''}>${c.date?`<datalist id="dl${this.uid}_${i}">${[...new Set(this.o.rows().map(r=>String(r[c.k]||'')).filter(Boolean))].sort().reverse().map(v=>`<option value="${E(v)}">`).join('')}</datalist>`:''}</th>`).join('')}${ac?'<th></th>':''}</tr></thead><tbody></tbody><tfoot></tfoot></table></div><div class="tmore"></div>`;
  $$('[data-f]',host).forEach(inp=>inp.addEventListener('input',()=>{this.col[inp.dataset.f]=inp.value;this.lim=150;this.body()}));
  $$('[data-s]',host).forEach(th=>th.addEventListener('click',()=>{const i=+th.dataset.s;this.sort=this.sort&&this.sort.i===i?{i,d:-this.sort.d}:{i,d:1};this.body()}));
  host.addEventListener('change',e=>{const s=e.target.closest('[data-sid]');if(s&&this.o.onChange)this.o.onChange(s.dataset.sid,s.value)});host.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&this.o.onAct)this.o.onAct(a.dataset.a,a.dataset.id);if(e.target.closest('[data-more]')){this.lim+=300;this.body()}});this.body()}
 body(){const cs=this.o.cols,rs=this.rows,h=this.host;if(!h)return;const show=rs.slice(0,this.lim);
  $('tbody',h).innerHTML=show.length?show.map(r=>`<tr>${cs.map(c=>{const raw=c.get?c.get(r):r[c.k];const cls=(c.num?'n ':'')+(c.cls?c.cls(r):'');return `<td class="${cls}">${c.html?c.html(r):(c.date&&raw?`<span class="dlink" data-dts="${r.contract_id||r.id}" title="عرض قائمة تواريخ العقد">${E(raw)}</span>`:(c.num?fnum(raw):E(raw)))}</td>`}).join('')}${this.o.actions?`<td class="ac">${this.o.actions(r)}</td>`:''}</tr>`).join(''):`<tr><td colspan="${cs.length+1}" class="empty">لا توجد بيانات مطابقة</td></tr>`;
  const sm=cs.some(c=>c.sum);$('tfoot',h).innerHTML=sm?`<tr>${cs.map((c,i)=>`<td>${c.sum?fnum(sum(rs,c.k)):(i===0?`الإجمالي (${rs.length})`:'')}</td>`).join('')}${this.o.actions?'<td></td>':''}</tr>`:'';
  $$('thead th[data-s]',h).forEach(th=>{const i=+th.dataset.s;$('.si',th).textContent=this.sort&&this.sort.i===i?(this.sort.d>0?'▲':'▼'):''});
  $('.tmore',h).innerHTML=rs.length>this.lim?`<button class="btn" data-more>عرض المزيد (${rs.length-this.lim})</button>`:`<span class="mut">عدد السجلات: ${rs.length}</span>`}
}

/* ---------- detail reports (contract / project) ---------- */
const hsort=(a,b)=>(a.stage_date+String(a.id).padStart(9,'0')).localeCompare(b.stage_date+String(b.id).padStart(9,'0'));
function stageDates(c){const d=STAGES.map(()=>'');S.history.filter(h=>String(h.contract_id)===String(c.id)).sort(hsort).forEach(h=>{d[sIdx(h.stage)]=h.stage_date});if(c.stage&&!d[sIdx(c.stage)])d[sIdx(c.stage)]=c.stage_date||'';return d}
function stageBys(c){const d=STAGES.map(()=>'');S.history.filter(h=>String(h.contract_id)===String(c.id)).sort(hsort).forEach(h=>{d[sIdx(h.stage)]=h.changed_by||''});if(c.stage&&!d[sIdx(c.stage)])d[sIdx(c.stage)]=c.updated_by||'';return d}
function datesModal(id){const c=S.contracts.find(x=>String(x.id)===String(id));if(!c)return;const hs=S.history.filter(h=>String(h.contract_id)===String(c.id)).sort(hsort);const rows=[['تاريخ الإضافة',c.created_at||'—',c.created_by||'—'],['تاريخ استلام العقد',c.receive_date||'—',''],['تاريخ تسليم العقد',c.delivery_date||'—',''],['تاريخ آخر تغيير للمرحلة ('+c.stage+')',c.stage_date||'—',c.updated_by||'—'],...hs.map(h=>['وصل إلى: '+h.stage,h.stage_date,h.changed_by||''])];modal('قائمة تواريخ العقد '+c.contract_no,plainTable(['البند','التاريخ','بواسطة'],rows.map(r=>r.map(E))))}
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function plainTable(head,rows){return `<div class="tw"><table class="dt"><thead><tr>${head.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function stepper(sd,ci){return `<div class="pipe">${STAGES.slice(1).map((s,k)=>{const i=k+1,st=i<ci?'done':(i===ci?'cur':'todo');return `<div class="seg ${i===ci?'on':''}" style="--c:${SC[i]};${i>ci?'opacity:.45;':''}"><b>${i<ci?'✔':(i===ci?'●':'○')}</b><span>${E(s)}</span><br><span>${E(sd[i]||'—')}</span></div>`}).join('')}</div>`}
function contractReport(id){
 const c=S.contracts.find(x=>String(x.id)===String(id));if(!c)return;
 const sd=stageDates(c),sb=stageBys(c),ci=sIdx(c.stage);
 const left=c.stage===FINAL?'مكتمل':(c.delivery_date?(()=>{const d=dayDiff(today(),c.delivery_date);return d<0?`متأخر ${-d} يوم`:`${d} يوم`})():'—');
 const info=[['رقم العقد',c.contract_no],['اسم المشروع',c.project_name||'—'],['البيان',c.description||'—'],['العدد',num(c.qty)],['الرصيد المتاح',num(c.balance)],['المطلوب تنفيذه',num(c.required)],['الوحدة الإنتاجية',c.unit||'—'],['تاريخ الإضافة',c.created_at||'—'],['تاريخ استلام العقد',c.receive_date||'—'],['تاريخ تسليم العقد',c.delivery_date||'—'],['المرحلة الحالية',c.stage],['تاريخ المرحلة',c.stage_date||'—'],['نسبة الإنجاز',prog(c)+'%'],['المتبقي للتسليم',left],['أضيف بواسطة',c.created_by||'—'],['آخر تعديل بواسطة',c.updated_by||'—'],['وقت آخر تعديل',c.updated_at||'—']];
 const rows=[];let prev=c.receive_date||c.created_at;
 for(let i=1;i<STAGES.length;i++){const d=sd[i],stt=i<ci?'تمت':(i===ci?'الحالية':'لم تبدأ');const dur=d&&prev?Math.max(0,dayDiff(prev,d)):null;rows.push([STAGES[i],stt,d||'—',dur===null?'—':dur+' يوم',sb[i]||'—']);if(d)prev=d}
 const hs=S.history.filter(h=>String(h.contract_id)===String(c.id)).sort(hsort).map(h=>[h.stage,h.stage_date,h.changed_by||'']);
 const sh=['المرحلة','الحالة','تاريخ الوصول للمرحلة','المدة منذ المرحلة السابقة','بواسطة'],hh=['المرحلة','تاريخ المرحلة','بواسطة'];
 const ids=['d_info','d_st','d_hist'],ttl='تقرير العقد '+c.contract_no;
 regBlock('d_info',{title:'بيانات العقد',kind:'kpi',modal:true,data:()=>({head:['البند','القيمة'],rows:info})});
 regBlock('d_st',{title:'مراحل الإنتاج والتواريخ',kind:'table',modal:true,data:()=>({head:sh,rows})});
 regBlock('d_hist',{title:'سجل تغيير المراحل',kind:'table',modal:true,data:()=>({head:hh,rows:hs})});
 const m=modal(ttl+(c.project_name?' — '+c.project_name:''),`<div class="tb" style="margin-bottom:10px">${toolsHtml(ids.join(','),ttl)}</div>${stepper(sd,ci)}<h4>بيانات العقد</h4><div class="dgrid">${info.map(([a,b])=>`<div><small>${E(a)}</small>${typeof b==='number'?fnum(b):E(b)}</div>`).join('')}</div><h4>مراحل الإنتاج والتواريخ</h4>${plainTable(sh,rows.map(r=>[E(r[0]),E(r[1]),E(r[2]),E(r[3]),E(r[4])]))}<h4>سجل تغيير المراحل</h4>${hs.length?plainTable(hh,hs.map(r=>[badge(r[0]),E(r[1]),E(r[2])])):'<div class="empty">لا يوجد سجل</div>'}`,{wide:true,onClose:()=>ids.forEach(i=>delete BLK[i])})}
function projectReport(name){
 const rs=S.contracts.filter(r=>(r.project_name||'بدون مشروع')===name),m=metrics(rs),ttl='تقرير المشروع '+name;
 const kp=[['عدد العقود',m.total],['إجمالي العدد',m.qty],['المطلوب تنفيذه',m.req],['الرصيد المتاح',m.bal],['متوسط الإنجاز %',m.prog],['عقود متأخرة',m.late.length]];
 const stRows=STAGES.map((s,i)=>[s,rs.filter(r=>sIdx(r.stage)===i).length]);
 const head=['رقم العقد','الوحدة','تاريخ الاستلام','تاريخ التسليم','المرحلة الحالية',...STAGES.slice(1).map(s=>'تاريخ: '+s),'الإنجاز %'];
 const raw=rs.map(c=>{const sd=stageDates(c);return[c.contract_no,c.unit||'—',c.receive_date||'—',c.delivery_date||'—',c.stage,...sd.slice(1).map(x=>x||'—'),prog(c)]});
 const ids=['d_info','d_stg','d_ctr'];
 regBlock('d_info',{title:'ملخص المشروع',kind:'kpi',modal:true,data:()=>({head:['المؤشر','القيمة'],rows:kp})});
 regBlock('d_stg',{title:'توزيع العقود على المراحل',kind:'kpi',modal:true,data:()=>({head:['المرحلة','عدد العقود'],rows:stRows})});
 regBlock('d_ctr',{title:'العقود ومراحلها وتواريخها',kind:'table',modal:true,data:()=>({head,rows:raw})});
 const html=rs.map((c,i)=>[ctrLink(c),E(raw[i][1]),E(raw[i][2]),E(raw[i][3]),badge(c.stage),...raw[i].slice(5,11).map(E),`<span class="pg"><i style="width:${raw[i][11]}%"></i></span> ${raw[i][11]}%`]);
 const m2=modal(ttl,`<div class="tb" style="margin-bottom:10px">${toolsHtml(ids.join(','),ttl)}</div><div class="grid g4">${kpiHtml(kp.map((k,i)=>({id:'p'+i,l:k[0],v:k[1],c:['#4f8cff','#19c3ff','#ffb020','#2de2a6','#b36bff','#ff4d6d'][i],i:['📄','🔢','🎯','📦','📈','⏰'][i]})))}</div><h4>توزيع العقود على مراحل الإنتاج</h4><div class="pipe">${stRows.map(([s,n],i)=>`<div class="seg" style="--c:${SC[i]}"><b>${n}</b><span>${E(s)}</span></div>`).join('')}</div><h4>العقود ومراحلها وتواريخ كل مرحلة (اضغط على رقم العقد لتقريره)</h4>${plainTable(head,html)}`,{wide:true,onClose:()=>ids.forEach(i=>delete BLK[i])});
 animateKpis(m2.el)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ctr],[data-proj],[data-dts]');if(!a)return;e.preventDefault();if(a.dataset.ctr)contractReport(a.dataset.ctr);else if(a.dataset.proj)projectReport(a.dataset.proj);else datesModal(a.dataset.dts)});

function vUsers(){
 const cols=[{k:'photo',t:'الصورة',get:r=>'',html:r=>r.photo?`<img src="${E(r.photo)}" style="width:34px;height:34px;border-radius:50%;object-fit:cover">`:'👤'},{k:'full_name',t:'الاسم الكامل'},{k:'username',t:'اسم المستخدم'},{k:'birth_date',t:'تاريخ الميلاد'},{k:'created_at',t:'تاريخ الإضافة'},{k:'is_admin',t:'الدور',get:r=>r.is_admin?'مدير النظام':'مستخدم'},{k:'units',t:'الوحدات المسموحة',get:r=>r.is_admin?'كل الوحدات':((r.units||[]).join('، ')||'— لا شيء —')}];
 const dt=new DT({cols,rows:()=>S.users,actions:r=>`${can('users.edit')?`<button class="btn sm" data-a="ed" data-id="${r.id}">✏️</button>`:''}${can('users.delete')&&String(r.id)!==String(S.user.id)?`<button class="btn sm bad" data-a="del" data-id="${r.id}">🗑</button>`:''}`,
  onAct:async(a,id)=>{const u=S.users.find(x=>String(x.id)===String(id));if(!u)return;if(a==='ed')userForm(u);else if(a==='del'&&await confirmBox(`حذف المستخدم ${u.full_name}؟`))act(async()=>{await API.call('deleteUser',{id:u.id});toast('تم الحذف');await reload();rerender()})}});
 $('#view').innerHTML=`<div class="vh"><h2>👥 المستخدمون</h2><div class="tb"><input id="gq" placeholder="🔍 بحث...">${can('users.add')?'<button class="btn pri" id="add">＋ مستخدم جديد</button>':''}</div></div><div class="panel" id="tbl"></div>`;
 dt.mount($('#tbl'));$('#gq').oninput=e=>{dt.q=e.target.value;dt.body()};const ad=$('#add');if(ad)ad.onclick=()=>userForm(null)}
function userForm(u){
 const n=!u,v=u||{full_name:'',username:'',birth_date:'',photo:'',is_admin:false,perms:[]};let photo=v.photo||'';
 const perms=new Set(v.perms||[]),units=new Set(v.units||[]);
 const m=modal(n?'إضافة مستخدم':'تعديل المستخدم',`<form id="uf"><div class="upl"><div id="av"></div><label class="btn">📷 إرفاق صورة<input type="file" accept="image/*" id="pf" hidden></label><button type="button" class="btn sm" id="pr">إزالة</button></div><br>
 <div class="fg"><label>الاسم الكامل *<input name="full_name" value="${E(v.full_name)}" required></label><label>اسم المستخدم *<input name="username" value="${E(v.username)}" required autocomplete="off" dir="ltr"></label>
 <label>كلمة المرور ${n?'*':'(اتركها فارغة للإبقاء على الحالية)'}<input name="password" type="password" ${n?'required':''} autocomplete="new-password" dir="ltr"></label><label>تاريخ الميلاد<input type="date" name="birth_date" value="${E(v.birth_date)}"></label>
 ${S.user.is_admin?`<label class="full" style="flex-direction:row;align-items:center;color:var(--tx)"><input type="checkbox" id="adm" style="width:auto" ${v.is_admin?'checked':''}> مدير النظام (كل الصلاحيات)</label>`:''}</div>
 <h4>🏭 الوحدات الإنتاجية المسموحة</h4><p class="mut" style="margin:0 0 6px">المستخدم يرى ويعدّل بيانات وعقود وحداته فقط (مدير النظام يرى الكل). بدون اختيار وحدة لا يرى أي عقد.</p><div class="perm"><div class="pl" id="um"></div></div>
 <h4>🔐 الصلاحيات (الشاشات والتقارير وبنودها)</h4><div id="pm"></div>
 <div class="fa"><button type="button" class="btn" data-c>إلغاء</button><button class="btn pri">${n?'إضافة':'حفظ'}</button></div></form>`,{wide:true,sticky:true});
 const av=()=>{$('#av',m.el).innerHTML=photo?`<img class="avatar" src="${E(photo)}">`:'<div class="avatar">👤</div>'};av();
 $('#pf',m.el).onchange=async e=>{const f=e.target.files[0];if(f)act(async()=>{photo=await imgData(f,200);av()})};$('#pr',m.el).onclick=()=>{photo='';av()};
 const mine=p=>S.user.is_admin||(S.user.perms||[]).includes(p);
 const drawP=()=>{$('#pm',m.el).innerHTML=PERM_TREE.map(g=>`<div class="perm"><h4>${g.t}<label class="btn sm"><input type="checkbox" data-all="${g.k}"> تحديد الكل</label></h4><div class="pl">${g.items.map(([k,t])=>{const p=g.k+'.'+k;return`<label><input type="checkbox" data-p="${p}" ${perms.has(p)?'checked':''} ${mine(p)?'':'disabled'}>${t}</label>`}).join('')}</div></div>`).join('')};drawP();
 const ulist=S.user.is_admin?allUnits():(S.user.units||[]);$('#um',m.el).innerHTML=ulist.length?ulist.map(x=>`<label><input type="checkbox" data-u="${E(x)}" ${units.has(x)?'checked':''}>${E(x)}</label>`).join(''):'<span class="mut">لا توجد وحدات إنتاجية، أضفها من شاشة إدارة البرنامج</span>';$('#um',m.el).onchange=e=>{const c=e.target;if(c.dataset.u!==undefined)c.checked?units.add(c.dataset.u):units.delete(c.dataset.u)};
 const adm=$('#adm',m.el),tog=()=>{$('#pm',m.el).style.opacity=adm&&adm.checked?.4:1;$('#pm',m.el).style.pointerEvents=adm&&adm.checked?'none':''};if(adm){adm.onchange=tog;tog()}
 $('#pm',m.el).onchange=e=>{const t=e.target;if(t.dataset.p){t.checked?perms.add(t.dataset.p):perms.delete(t.dataset.p)}else if(t.dataset.all){$$(`[data-p^="${t.dataset.all}."]`,m.el).forEach(c=>{if(!c.disabled){c.checked=t.checked;t.checked?perms.add(c.dataset.p):perms.delete(c.dataset.p)}})}};
 $('[data-c]',m.el).onclick=m.close;
 $('#uf',m.el).onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.photo=photo;d.perms=[...perms];d.units=[...units];d.is_admin=!!(adm&&adm.checked);if(u)d.id=u.id;act(async()=>{await API.call('saveUser',d);m.close();toast('تم الحفظ');await reload();rerender()})}}

/* ---------- settings ---------- */
function vSettings(){
 const st=S.settings,ed=can('settings.edit');let logo=st.logo||'';
 $('#view').innerHTML=`<div class="vh"><h2>⚙️ إدارة البرنامج</h2></div><div class="panel"><div class="fg">
 <label class="full">اسم البرنامج<input id="sn" value="${E(st.name)}" ${ed?'':'disabled'}></label>
 <label class="full">شعار البرنامج (يظهر في الشاشة الرئيسية وشاشة الدخول والتقارير)<div class="upl"><div class="logo" id="lgv" style="width:90px;height:90px"></div>${ed?'<label class="btn">📎 إرفاق شعار<input type="file" accept="image/*" id="lf" hidden></label><button class="btn sm" id="lr">إزالة</button>':''}</div></label>
 <label class="full">الوحدات الإنتاجية (وحدة في كل سطر)<textarea id="su" rows="5" ${ed&&S.user.is_admin?'':'disabled'}>${E((st.units||[]).join('\n'))}</textarea></label>
 <label>رقم واتساب الافتراضي للإرسال (صيغة دولية)<input id="sw" dir="ltr" value="${E(st.wa_phone||'')}" ${ed?'':'disabled'}></label></div>
 ${ed?'<div class="fa"><button class="btn pri" id="ss">💾 حفظ الإعدادات</button></div>':''}</div>
 ${can('settings.demo')?'<div class="panel"><h3>🧪 بيانات تجريبية</h3><p class="mut">لتجربة اللوحات والرسوم: يضيف حوالي 48 عقداً تجريبياً (لا يمسّ العقود الموجودة).</p><button class="btn" id="sd">إضافة بيانات تجريبية</button></div>':''}`;
 const sl=()=>{$('#lgv').innerHTML=logo?`<img src="${E(logo)}">`:'📑'};sl();
 if(ed){$('#lf').onchange=e=>{const f=e.target.files[0];if(f)act(async()=>{logo=await imgData(f,320);sl()})};$('#lr').onclick=()=>{logo='';sl()};
  $('#ss').onclick=()=>act(async()=>{await API.call('saveSettings',{name:$('#sn').value.trim()||st.name,logo,units:$('#su').value.split('\n').map(x=>x.trim()).filter(Boolean),wa_phone:$('#sw').value.trim()});toast('تم حفظ الإعدادات');await reload();rerender()})}
 const sd=$('#sd');if(sd)sd.onclick=()=>act(async()=>{const us=allUnits().length?allUnits():['الوحدة الأولى','الوحدة الثانية','الوحدة الثالثة'];if(!st.units.length)await API.call('saveSettings',{name:st.name,logo:st.logo,units:us,wa_phone:st.wa_phone});const items=['كراسي مكتبية','أبواب معدنية','لوكرات حديد','طاولات اجتماعات','أسرّة طبية','خزائن ملفات','دواليب تخزين','أثاث مدرسي','مقاعد انتظار','أرفف معدنية'],t=today(),list=[];
  for(let i=0;i<48;i++){const stg=Math.floor(Math.random()*7),rec=addDays(t,-Math.floor(Math.random()*90)),del=addDays(rec,20+Math.floor(Math.random()*70)),qty=(1+Math.floor(Math.random()*40))*25,req=Math.round(qty*(.4+Math.random()*.6));list.push({contract_no:'تجريبي-'+(1001+i),project_name:['مشروع المستشفى الجامعي','مشروع المدرسة الدولية','مشروع الفندق السياحي','مشروع الجامعة الحكومية','مشروع المجمع الإداري'][i%5],description:items[i%items.length],qty,required:req,balance:Math.max(0,qty-Math.round(req*Math.random())),unit:us[i%us.length],receive_date:rec,delivery_date:del,stage:STAGES[stg],stage_date:addDays(rec,Math.min(60,stg*8)>0?Math.min(Math.floor((new Date(t)-new Date(rec))/864e5),stg*8):0),created_at:rec})}
  const r=await API.call('bulkContracts',{list});toast(`تمت إضافة ${r.added} عقد`);await reload();rerender()})}

/* ---------- password ---------- */
function pwForm(){const m=modal('تغيير كلمة المرور',`<div class="fg"><label class="full">كلمة المرور الحالية<input type="password" id="po"></label><label class="full">كلمة المرور الجديدة<input type="password" id="pn"></label></div><div class="fa"><button class="btn pri" id="pk">حفظ</button></div>`,{sticky:true});$('#pk',m.el).onclick=()=>act(async()=>{await API.call('changePassword',{old:$('#po',m.el).value,new:$('#pn',m.el).value});m.close();toast('تم تغيير كلمة المرور')})}

/* ---------- boot ---------- */
async function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p){$('#lerr').textContent='أدخل اسم المستخدم وكلمة المرور';return}$('#lgo').disabled=true;try{const r=await API.call('login',{username:u,password:p});API.token=r.token;try{localStorage.setItem('ctk',r.token)}catch(_){}await enter()}catch(e){$('#lerr').textContent=e.message}finally{$('#lgo').disabled=false}}
$('#lgo').onclick=doLogin;$('#lp').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#lu').onkeydown=e=>{if(e.key==='Enter')$('#lp').focus()};
$('#outb').onclick=async()=>{try{await API.call('logout')}catch(_){}API.token=null;try{localStorage.removeItem('ctk')}catch(_){}S.user=null;showLogin()};
$('#pwb').onclick=pwForm;$('#menu').onclick=()=>$('#nav').classList.toggle('open');
$('#nav').onclick=e=>{const a=e.target.closest('[data-go]');if(a)go(a.dataset.go)};
setInterval(()=>{const c=$('#clock');if(c)c.textContent=new Date().toLocaleString('en-GB')},1000);
if(window.Chart){Chart.defaults.font.family="Cairo, Tahoma, sans-serif"}
(async function(){brand();showLogin();try{const p=await API.call('publicInfo');S.settings=Object.assign(S.settings,p);brand()}catch(_){}
 try{const t=localStorage.getItem('ctk');if(t){API.token=t;await enter()}}catch(e){API.token=null}})();
</script>
</body>
</html>
